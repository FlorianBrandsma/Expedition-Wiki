services:
  expedition-wiki:
    container_name: expedition-wiki_c
    build: 
      context: .
      dockerfile: expedition-wiki/Dockerfile
      target: development
    ports:
      - '3000:3000'
    volumes:
      - ./expedition-wiki:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev
    network_mode: "bridge"
    extra_hosts:
      - "host.docker.internal:host-gateway"